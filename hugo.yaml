baseURL: "https://yaluncoco.github.io/"
languageCode: "zh-cn"
title: "亚伦格林"

theme: "PaperMod"


pagination:
  pagerSize: 10


enableRobotsTXT: true


taxonomies:
  category: categories
  tag: tags


params:

  env: production

  defaultTheme: auto

  ShowReadingTime: true

  ShowShareButtons: true

  ShowCodeCopyButtons: true

  ShowPostNavLinks: true

  ShowBreadCrumbs: true

  ShowToc: true

  TocOpen: false

  ShowRssButtonInSectionTermList: true

  ShowFullTextinRSS: true


  homeInfoParams:

    Title: "👣步履不停👣"

    Content: |
      有意义和没意义本身就会消磨人。
      所以好好活就是有意义，有意义就是好好活。


  fuseOpts:

    isCaseSensitive: false

    shouldSort: true

    location: 0

    distance: 1000

    threshold: 0.4

    minMatchCharLength: 2

    keys:
      - title
      - permalink
      - summary
      - content
      - tags
      - categories



menu:

  main:

    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10


    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20


    - identifier: search
      name: Search
      url: /search/
      weight: 30


    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40


    - identifier: faq
      name: FAQ
      url: /faq/
      weight: 50



outputs:

  home:

    - HTML
    - RSS
    - JSON


markup:

  goldmark:

    renderer:

      unsafe: true